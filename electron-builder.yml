appId: com.fingerprintbrowser.desktop
productName: FingerprintBrowser
directories:
  output: release
  buildResources: build
icon: build/icon.png
files:
  - electron/dist/**/*
  - package.json
# The console UI is read from process.resourcesPath/ui at runtime (FB_ROOT).
extraResources:
  - from: ui
    to: ui
  # Provisioned fingerprint browsers. Keep browser-dist/ present (even empty);
  # CI fills it via `PLAYWRIGHT_BROWSERS_PATH=browser-dist npx patchright install chromium`.
  - from: browser-dist
    to: browsers
# macOS notarization hook (root-level option). Self-skips without APPLE_* creds.
afterSign: electron/notarize.cjs
linux:
  target:
    - AppImage
  category: Utility
mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
win:
  target:
    - nsis
    - portable
  signingHashAlgorithms:
    - sha256
  rfc3161TimeStampServer: http://timestamp.digicert.com
