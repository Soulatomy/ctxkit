name: desktop-build

# Builds distributable desktop installers on native runners:
#  - windows-latest : x86_64 Windows (NSIS + portable)
#  - macos-14       : Apple Silicon (arm64) macOS (dmg + zip)
#
# Trigger: manual, or pushing a tag like v0.1.0.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact: windows-x64
          - os: macos-14
            target: --mac
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      # Bundle the fingerprint Chromium into the app (goes to resources/browsers).
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/browser-dist
      # Use the certificate from *_CSC_LINK rather than searching the keychain.
      # Signing is skipped automatically when the secrets are empty.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Windows Authenticode (base64 of the .pfx, or a URL)
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      # macOS Developer ID Application certificate (base64 of the .p12)
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      # macOS notarization (app-specific password from appleid.apple.com)
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & unit/API tests
        run: npm run typecheck && npm test

      - name: Provision Chromium into the bundle
        run: npx patchright install chromium

      - name: Provision Camoufox into the bundle
        run: npx camoufox fetch

      - name: Copy Camoufox into browser-dist
        run: node scripts/provision-camoufox.mjs

      - name: Build icon + Electron bundle
        run: npm run make:icon && npm run electron:build

      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
          if-no-files-found: warn
